<header class="site-header">
  <div class="container barra">
    <a class="brand" routerLink="/" aria-label="rejoya, inicio"><app-logo /></a>

    <form class="buscador" role="search" (submit)="buscar($event, q.value)">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input #q type="search" placeholder="Busca anillos, collares, pendientes…" aria-label="Buscar joyas" [value]="textoBuscado()" />
    </form>

    <app-site-menu />
  </div>
</header>
